name: Assemble Sima Yi redesign asset

on:
  push:
    branches:
      - asset-upload-sima-yi-bright
    paths:
      - .asset-upload/sima-yi/READY

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out upload branch
        uses: actions/checkout@v4
        with:
          ref: asset-upload-sima-yi-bright

      - name: Assemble and validate AVIF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p graphic-design/new-hero-design/sima-yi
          cat .asset-upload/sima-yi/0*.txt | base64 -d > graphic-design/new-hero-design/sima-yi/sima-yi-new-design.avif
          test "$(stat -c%s graphic-design/new-hero-design/sima-yi/sima-yi-new-design.avif)" = "32608"
          file graphic-design/new-hero-design/sima-yi/sima-yi-new-design.avif

      - name: Commit assembled redesign asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add graphic-design/new-hero-design/sima-yi/sima-yi-new-design.avif
          git commit -m "art: assemble Sima Yi bright redesign asset"
          git push origin HEAD:asset-upload-sima-yi-bright
