name: Assemble Sun Quan redesign asset

on:
  push:
    branches:
      - asset-upload-sun-quan-bright
    paths:
      - .asset-upload/sun-quan/READY

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out upload branch
        uses: actions/checkout@v4
        with:
          ref: asset-upload-sun-quan-bright

      - name: Assemble and validate AVIF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p graphic-design/new-hero-design/sun-quan
          cat .asset-upload/sun-quan/0*.txt | base64 -d > graphic-design/new-hero-design/sun-quan/sun-quan-new-design.avif
          test "$(stat -c%s graphic-design/new-hero-design/sun-quan/sun-quan-new-design.avif)" = "65861"
          file graphic-design/new-hero-design/sun-quan/sun-quan-new-design.avif

      - name: Commit assembled redesign asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add graphic-design/new-hero-design/sun-quan/sun-quan-new-design.avif
          git commit -m "art: assemble Sun Quan bright redesign asset"
          git push origin HEAD:asset-upload-sun-quan-bright
