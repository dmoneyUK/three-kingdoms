name: UX Browser Diagnostics (manual, not visual acceptance)

on:
  workflow_dispatch:

concurrency:
  group: ux-browser-diagnostics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser:
    name: Full browser diagnostics (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: "npm"
      - run: npm ci
      - name: Install Chromium for browser diagnostics
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run full browser diagnostic shard
        run: npm run test:browser -- --shard=${{ matrix.shard }}/2
      - name: Upload Playwright browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-browser-diagnostics-shard-${{ matrix.shard }}-playwright-report
          path: |
            tests/browser/playwright-report/
            tests/browser/test-results/browser/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Wrangler browser-worker log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ux-browser-diagnostics-shard-${{ matrix.shard }}-wrangler-log
          path: .wrangler/browser-worker.log
          if-no-files-found: ignore
          retention-days: 3
