name: UX3 CI only

on:
  push:
    branches: [ux3]
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ux3-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
  WRANGLER_SEND_METRICS: "false"

# Owner-approved isolated validation. No deployment jobs, cloud credentials,
# remote migrations, production smoke, or pull_request triggers.
jobs:
  staging-config:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ux3'
    name: UX3 staging config guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: "npm"
      - run: npm ci
      - name: Run staging config guard unit tests
        run: node --test tests/ux3-staging-config.test.mjs
      - name: Build the isolated UX3 staging config locally
        run: npm run build
        env:
          CLOUDFLARE_ENV: ux3-staging
      - name: Reject unsafe generated targets
        run: node scripts/verify-ux3-staging-config.mjs --mode preparation --config dist/server/wrangler.json

  lint-fast:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ux3'
    name: Lint and fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: "npm"
      - name: Install dependencies
        id: install
        run: npm ci
      - name: Check Linux stack limit for ESLint
        run: |
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";

            const stackLimit = execFileSync("bash", ["-c", "ulimit -s"], { encoding: "utf8" }).trim();
            const sufficient = stackLimit === "unlimited" || Number(stackLimit) >= 4096;
            console.log(`Linux stack limit: ${stackLimit} KiB; ESLint V8 stack: 4096 KiB.`);
            if (!sufficient) process.exit(1);
          '
      - name: Run ESLint with full React Compiler rule coverage
        run: node --stack-size=4096 --max-old-space-size=8192 ./node_modules/eslint/bin/eslint.js . --ignore-pattern dist --ignore-pattern .next
      - name: Build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
      - name: Fast tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.build.outcome == 'success' }}
        run: npm run test:fast

  api:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ux3'
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - run: npm run test:api

  browser-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ux3'
    name: Browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser:smoke
