name: Deploy to Cloudflare

on:
  push:
    branches: [main, ux-v2, feature/smart-bot-player, review/aip-staging-lifecycle-01, review/aip-perf-bot-02]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main, ux-v2, feature/smart-bot-player]
    paths-ignore:
      - "**/*.md"

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  queue: max

env:
  NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}

# Keep required push browser validation bounded to room startup and the committed-result H4 DOM contract.
# Broad UX diagnostics remain manual until the user accepts the rendered behavior.
jobs:
  lint-fast:
    name: Lint and fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: "npm"
      - run: npm ci
      - name: Run ESLint with full React Compiler rule coverage
        run: npm run lint
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - name: Build for rendered HTML coverage
        run: npm run build
      - run: npm run test:fast

  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - name: Run API tests
        run: npm run test:api
        env:
          WRANGLER_LOG_PATH: .wrangler/api-logs
      - name: Upload Wrangler API runtime logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-wrangler-runtime-logs
          path: .wrangler/api-logs/
          if-no-files-found: ignore
          retention-days: 3

  browser-smoke:
    name: Browser startup and visible committed H4 smoke (2 tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: "npm"
      - run: npm ci
      - name: Install Chromium for browser validation
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run room creation and game startup smoke
        run: npm run test:browser:smoke
      - name: Upload Playwright browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-playwright-report
          path: |
            tests/browser/playwright-report/
            tests/browser/test-results/browser/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Wrangler browser-worker log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-wrangler-log
          path: .wrangler/browser-worker.log
          if-no-files-found: ignore
          retention-days: 3

  deploy-staging:
    name: Deploy isolated AI Staging Worker
    needs: [lint-fast, api, browser-smoke]
    # The review ref is validation-only; this guard intentionally permits deploys only from the active AI branch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/smart-bot-player'
    environment:
      name: ai-staging
      url: https://three-kingdoms-ai-staging.dai-jinge.workers.dev
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STAGING_URL: https://three-kingdoms-ai-staging.dai-jinge.workers.dev
      STAGING_DEPLOY_TAG: aip-staging-${{ github.run_id }}-${{ github.sha }}
      STAGING_LIFECYCLE_EVIDENCE_DIR: .wrangler/ai-staging-lifecycle
    steps:
      - name: Record Staging lifecycle budget
        shell: bash
        run: |
          set -euo pipefail
          started_ms="$(node -e 'process.stdout.write(String(Math.floor(performance.timeOrigin + performance.now())))')"
          started="$((started_ms / 1000))"
          deadline="$((started + 1200))"
          {
            echo "STAGING_LIFECYCLE_STARTED_EPOCH=$started"
            echo "STAGING_LIFECYCLE_DEADLINE_EPOCH=$deadline"
            echo "STAGING_LIFECYCLE_STARTED_EPOCH_MS=$started_ms"
          } >> "$GITHUB_ENV"
          echo "::notice::Staging lifecycle T0=$started_ms deadline=$deadline; active probes stop by T0+14m and six-minute cleanup/readback reserve"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: "npm"
      - run: npm ci
      - name: Verify Staging target guard regressions
        run: node --test tests/ai-staging-config.test.mjs tests/ai-staging-lifecycle.test.mjs tests/browser/staging-room-reconnect-diagnostics.test.mjs tests/browser/staging-room-reconnect-logic.test.mjs
      - name: Preflight paused Staging lifecycle and ownership
        id: staging_lifecycle_preflight
        run: node scripts/ai-staging-lifecycle.mjs preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: S1 baseline read-only D1 room guard
        id: staging_room_guard_baseline
        run: STAGING_ROOM_GUARD_PHASE=baseline node scripts/ai-staging-lifecycle.mjs room-guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Install Chromium for mobile Staging smoke
        run: npx playwright install --with-deps chromium
      - name: Build for the Staging environment
        run: npm run build
        env:
          CLOUDFLARE_ENV: ai-staging
      - name: Verify generated Worker and D1 target
        run: node scripts/verify-ai-staging-config.mjs
      - name: Dry-run the Staging Worker deployment
        run: npx wrangler deploy --dry-run --config dist/server/wrangler.json --name three-kingdoms-ai-staging --tag "$STAGING_DEPLOY_TAG"
      - name: S1 pre-activation room guard
        id: staging_room_guard_pre_activation
        run: STAGING_ROOM_GUARD_PHASE=pre_activation node scripts/ai-staging-lifecycle.mjs room-guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Enforce pre-activation lifecycle budget
        run: STAGING_LIFECYCLE_PHASE=before_activation node scripts/ai-staging-lifecycle.mjs budget
        env:
          STAGING_LIFECYCLE_STARTED_EPOCH_MS: ${{ env.STAGING_LIFECYCLE_STARTED_EPOCH_MS }}
          STAGING_LIFECYCLE_NOW_EPOCH_MS: ${{ env.STAGING_LIFECYCLE_STARTED_EPOCH_MS }}
      - name: Require exact-SHA Hosted safety gate
        run: node scripts/ai-staging-lifecycle.mjs hosted-gate
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          STAGING_EXPECTED_SHA: ${{ github.sha }}
          STAGING_S1_PASSED: "true"
          STAGING_S2_PASSED: ${{ vars.STAGING_S2_PASSED || 'false' }}
          STAGING_HISTORICAL_CREDENTIAL_DISPOSITION: ${{ vars.STAGING_HISTORICAL_CREDENTIAL_DISPOSITION || '' }}
          STAGING_CONTROLLED_ACCESS: ${{ vars.STAGING_CONTROLLED_ACCESS || 'false' }}
      - name: Require bounded activation window
        shell: bash
        run: |
          set -euo pipefail
          remaining="$((STAGING_LIFECYCLE_DEADLINE_EPOCH - $(date +%s)))"
          if (( remaining < 840 )); then
            echo "Insufficient lifecycle budget before activation (${remaining}s remain; need at least 840s)." >&2
            exit 1
          fi
          echo "::notice::Activation window has ${remaining}s; active probes are capped at 840s and at least 360s remains reserved for containment/readback/artifacts"
      - name: Apply Staging D1 migrations
        run: timeout 240s npx wrangler d1 migrations apply three-kingdoms-ai-staging-db --remote --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Staging Worker
        run: timeout 300s npx wrangler deploy --config dist/server/wrangler.json --name three-kingdoms-ai-staging --tag "$STAGING_DEPLOY_TAG" --message "AIP-PERF-01 Staging lifecycle $GITHUB_RUN_ID"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Record Staging activation timestamp
        run: |
          activation_ms="$(node -e 'process.stdout.write(String(Math.floor(performance.timeOrigin + performance.now())))')"
          {
            echo "STAGING_LIFECYCLE_ACTIVATION_EPOCH=$((activation_ms / 1000))"
            echo "STAGING_LIFECYCLE_ACTIVATION_EPOCH_MS=$activation_ms"
          } >> "$GITHUB_ENV"
          STAGING_LIFECYCLE_PHASE=active \
          STAGING_LIFECYCLE_STARTED_EPOCH_MS="$STAGING_LIFECYCLE_STARTED_EPOCH_MS" \
          STAGING_LIFECYCLE_ACTIVATION_EPOCH_MS="$activation_ms" \
          STAGING_LIFECYCLE_NOW_EPOCH_MS="$activation_ms" \
          node scripts/ai-staging-lifecycle.mjs budget
      - name: Capture owned Staging deployment version
        if: always() && steps.staging_lifecycle_preflight.outcome == 'success'
        run: timeout 120s node scripts/ai-staging-lifecycle.mjs capture
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Bound mobile smoke to remaining lifecycle budget
        shell: bash
        run: |
          set -euo pipefail
          remaining="$((STAGING_LIFECYCLE_DEADLINE_EPOCH - $(date +%s)))"
          smoke_budget="$((remaining - 360))"
          if (( smoke_budget > 840 )); then smoke_budget=840; fi
          if (( smoke_budget < 60 )); then
            echo "Insufficient lifecycle budget for bounded mobile smoke (${remaining}s remain)." >&2
            exit 1
          fi
          echo "STAGING_SMOKE_TIMEOUT_SECONDS=$smoke_budget" >> "$GITHUB_ENV"
          echo "::notice::Mobile smoke budget=${smoke_budget}s; 360s reserved for containment/readback"
      - name: S1 active-window room guard
        if: steps.staging_room_guard_baseline.outcome == 'success'
        run: STAGING_ROOM_GUARD_PHASE=monitor node scripts/ai-staging-lifecycle.mjs room-guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_LIFECYCLE_ACTIVATION_EPOCH: ${{ env.STAGING_LIFECYCLE_ACTIVATION_EPOCH }}
          STAGING_LIFECYCLE_ACTIVATION_EPOCH_MS: ${{ env.STAGING_LIFECYCLE_ACTIVATION_EPOCH_MS }}
      - name: Verify health and mobile room refresh/rejoin
        run: timeout "${STAGING_SMOKE_TIMEOUT_SECONDS}s" npx playwright test --config tests/browser/staging-playwright.config.mjs
      - name: Contain Staging Worker and Cron
        if: always()
        run: |
          set -euo pipefail
          remaining="$((STAGING_LIFECYCLE_DEADLINE_EPOCH - $(date +%s)))"
          contain_budget="$((remaining - 60))"
          if (( contain_budget > 300 )); then contain_budget=300; fi
          if (( contain_budget < 30 )); then contain_budget=30; fi
          echo "::notice::Containment budget=${contain_budget}s"
          timeout "${contain_budget}s" node scripts/ai-staging-lifecycle.mjs contain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: S1 post-closure read-only D1 room guard
        if: always() && steps.staging_room_guard_baseline.outcome == 'success'
        run: STAGING_ROOM_GUARD_PHASE=post_closure node scripts/ai-staging-lifecycle.mjs room-guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_LIFECYCLE_STARTED_EPOCH: ${{ env.STAGING_LIFECYCLE_STARTED_EPOCH }}
          STAGING_LIFECYCLE_ACTIVATION_EPOCH_MS: ${{ env.STAGING_LIFECYCLE_ACTIVATION_EPOCH_MS }}
      - name: Upload Staging lifecycle and mobile smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-mobile-smoke-evidence
          path: tests/browser/test-results/staging-browser/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Staging lifecycle readback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-lifecycle-evidence
          path: .wrangler/ai-staging-lifecycle/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    needs: [lint-fast, api, browser-smoke]
    # Production remains restricted to the original release branches; review refs are always skipped.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ux-v2')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: "npm"
      - run: npm ci
      - run: npm run db:generate
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply three-kingdoms-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Build
        run: npm run build
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Smoke test production
        env:
          PRODUCTION_URL: https://three-kingdoms.dai-jinge.workers.dev
        run: |
          set -eu
          curl --fail --silent --show-error --location --max-time 20 "$PRODUCTION_URL/" >/dev/null
          curl --fail --silent --show-error --location --max-time 20 "$PRODUCTION_URL/api/health" >/dev/null
