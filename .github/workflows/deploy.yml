name: Deploy to Cloudflare

on:
  push:
    branches: [main, ux-v2, feature/smart-bot-player]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main, ux-v2, feature/smart-bot-player]
    paths-ignore:
      - "**/*.md"

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  queue: max

env:
  NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}

# Keep required push browser validation to the server-backed room/startup smoke.
# Broad UX diagnostics remain manual until the user accepts the rendered behavior.
jobs:
  lint-fast:
    name: Lint and fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: "npm"
      - run: npm ci
      - name: Run ESLint with full React Compiler rule coverage
        run: npm run lint
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - name: Build for rendered HTML coverage
        run: npm run build
      - run: npm run test:fast

  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - run: npm run test:api

  browser-smoke:
    name: Browser startup and room smoke (1 test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: "npm"
      - run: npm ci
      - name: Install Chromium for browser validation
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run room creation and game startup smoke
        run: npm run test:browser:smoke
      - name: Upload Playwright browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-playwright-report
          path: |
            tests/browser/playwright-report/
            tests/browser/test-results/browser/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Wrangler browser-worker log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-wrangler-log
          path: .wrangler/browser-worker.log
          if-no-files-found: ignore
          retention-days: 3

  deploy-staging:
    name: Deploy isolated AI Staging Worker
    needs: [lint-fast, api, browser-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/smart-bot-player'
    environment:
      name: ai-staging
      url: https://three-kingdoms-ai-staging.dai-jinge.workers.dev
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      STAGING_URL: https://three-kingdoms-ai-staging.dai-jinge.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: "npm"
      - run: npm ci
      - name: Verify Staging target guard regressions
        run: node --test tests/ai-staging-config.test.mjs
      - name: Install Chromium for mobile Staging smoke
        run: npx playwright install --with-deps chromium
      - name: Build for the Staging environment
        run: npm run build
        env:
          CLOUDFLARE_ENV: ai-staging
      - name: Verify generated Worker and D1 target
        run: node scripts/verify-ai-staging-config.mjs
      - name: Dry-run the Staging Worker deployment
        run: npx wrangler deploy --dry-run --env ai-staging --config dist/server/wrangler.json
        env:
          CLOUDFLARE_ENV: ai-staging
      - name: Apply Staging D1 migrations
        run: npx wrangler d1 migrations apply three-kingdoms-ai-staging-db --remote --env ai-staging --config dist/server/wrangler.json
        env:
          CLOUDFLARE_ENV: ai-staging
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Staging Worker
        run: npx wrangler deploy --env ai-staging --config dist/server/wrangler.json
        env:
          CLOUDFLARE_ENV: ai-staging
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify health and mobile room refresh/rejoin
        run: npx playwright test --config tests/browser/staging-playwright.config.mjs

  deploy:
    needs: [lint-fast, api, browser-smoke]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ux-v2')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: "npm"
      - run: npm ci
      - run: npm run db:generate
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply three-kingdoms-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Build
        run: npm run build
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Smoke test production
        env:
          PRODUCTION_URL: https://three-kingdoms.dai-jinge.workers.dev
        run: |
          set -eu
          curl --fail --silent --show-error --location --max-time 20 "$PRODUCTION_URL/" >/dev/null
          curl --fail --silent --show-error --location --max-time 20 "$PRODUCTION_URL/api/health" >/dev/null
