name: Harvest continuity focused proof
on:
  workflow_dispatch:
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser -- tests/browser/bumper-harvest-touch-pass-through-real-gameplay.spec.mjs --grep '§10.49 Harvest choice' --workers=1 --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harvest-continuity-proof
          path: |
            tests/browser/test-results/browser/
            tests/browser/playwright-report/
          retention-days: 7
